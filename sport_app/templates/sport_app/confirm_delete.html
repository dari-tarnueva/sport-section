{% extends 'sport_app/base.html' %}
{% block title %}Удаление{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Удаление</h1>
    <p>Вы действительно хотите удалить <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url cancel_url %}" class="btn">Отмена</a>
    </form>
</div>
{% endblock %}
